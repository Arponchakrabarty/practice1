<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>summer sale</title>
</head>
<body>
    <section style="background-color: bisque; height: 50vh;">
        <div  style="display: flex; gap: 50px; ">
            <div id="kdiv" style="background-color: beige; padding: 40px; cursor: pointer; ">
                <p>name <span id="k-div-name">k accessories</span></p>
                <p>tk <span id="k-div-price">40</span></p>
            </div>
            <div id="ydiv" style="background-color: beige; padding: 40px;cursor: pointer; ">
                <p>name <span id="y-div-name">y accessories</span></p>
                <p>tk <span id="y-div-price">60</span></p>
            </div>
            <div id="mdiv" style="background-color: beige; padding: 40px; cursor: pointer; ">
                <p>name <span id="m-div-name">m accessories</span></p>
                <p>tk <span id="m-div-price">80</span></p>
            </div>
        </div>

    </section>
<section id="show">
    <div>
        <p>total item: <span  id="total-item"> 0</span></p>
        <p > total price: <span id="total-price">0</span> </p>
    </div>
<ul id="ul"></ul>
</section>
    <script src="./index.js"></script>
